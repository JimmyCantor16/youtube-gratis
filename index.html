<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sala TV</title>
<meta name="description" content="Películas, series y documentales en una tele con control remoto.">
<meta name="theme-color" content="#090B15">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='6' width='26' height='18' rx='5' fill='none' stroke='%2300E0AC' stroke-width='3'/%3E%3Cpath d='M11 28h10' stroke='%2300E0AC' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&family=Righteous&family=VT323&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://i.ytimg.com">
<link rel="stylesheet" href="assets/sala.css">
</head>
<body class="sala">

<header class="top">
  <a class="logo" href="./" aria-label="Inicio">
    <span class="logo-tv" aria-hidden="true"></span><span id="marca">Sala TV</span>
  </a>
  <label class="buscar">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" type="search" placeholder="Buscar películas, series, géneros…" autocomplete="off" aria-label="Buscar">
  </label>
  <button class="perfil" id="perfil" type="button" aria-haspopup="true">
    <span class="perfil-ava" aria-hidden="true">A</span><span class="perfil-nom">Adulto</span>
  </button>
</header>

<div class="aviso-infantil" id="aviso-infantil" hidden>
  Perfil infantil: solo contenido para todo público y mayores de 7.
</div>

<section class="escenario" aria-label="La tele">
  <div class="cuarto">
    <div class="tv" id="tv">
      <div class="tv-ambi" id="ambi" aria-hidden="true"></div>
      <svg class="tv-antena" viewBox="0 0 200 90" aria-hidden="true"><path d="M100 88 30 6M100 88 168 14"/><circle cx="30" cy="6" r="6"/><circle cx="168" cy="14" r="6"/></svg>
      <div class="tv-cuerpo">
        <div class="tv-marco">
          <div class="pantalla" id="pantalla">
            <div class="host"><div id="reproductor"></div></div>
            <button class="poster" id="poster" type="button" aria-label="Ver">
              <img id="poster-img" alt="">
              <span class="poster-play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>
            </button>
            <div class="pantalla-apagada" id="apagada" hidden><i></i></div>
            <div class="sin-senal" id="sin-senal" hidden></div>
            <div class="osd" id="osd" aria-live="polite"></div>
            <div class="rotulo" id="rotulo" hidden></div>
            <div class="scan" aria-hidden="true"></div>
            <div class="vig" aria-hidden="true"></div>
            <div class="vidrio" aria-hidden="true"></div>
          </div>
        </div>
        <div class="tv-ctrl" aria-hidden="true">
          <span class="perilla"></span><span class="perilla p2"></span><span class="led" id="led"></span>
          <span class="rejilla"><i></i><i></i><i></i><i></i></span>
        </div>
        <div class="tv-marca" id="tv-marca">Sala <span>TV</span></div>
      </div>
      <div class="tv-patas" aria-hidden="true"><i></i><i></i></div>
    </div>
    <div class="piso" aria-hidden="true"></div>
  </div>

  <aside class="mando" aria-label="Control remoto">
    <div class="mando-fila">
      <button class="tecla roja-power" data-accion="power" aria-label="Encender o apagar"><svg viewBox="0 0 24 24"><path d="M12 3v9"/><path d="M6.4 6.6a8 8 0 1 0 11.2 0"/></svg></button>
      <button class="tecla" data-accion="mute" aria-label="Silenciar"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="m17 9 5 6M22 9l-5 6"/></svg></button>
    </div>
    <div class="mando-numeros" id="numeros"></div>
    <div class="mando-cruz">
      <button class="tecla" data-accion="ch+" aria-label="Canal siguiente"><svg viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg><small>CH</small></button>
      <button class="tecla" data-accion="vol+" aria-label="Subir volumen"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><small>VOL</small></button>
      <button class="tecla" data-accion="ch-" aria-label="Canal anterior"><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg><small>CH</small></button>
      <button class="tecla" data-accion="vol-" aria-label="Bajar volumen"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg><small>VOL</small></button>
    </div>
    <div class="mando-fila tres">
      <button class="tecla" data-accion="prev" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M6 5v14M19 5 9 12l10 7z"/></svg></button>
      <button class="tecla ok" data-accion="ok" aria-label="Reproducir o pausar"><svg viewBox="0 0 24 24"><path d="M7 5v14l11-7z"/></svg></button>
      <button class="tecla" data-accion="next" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M18 5v14M5 5l10 7-10 7z"/></svg></button>
    </div>
    <div class="mando-fila mando-ficha">
      <button class="tecla ancha" data-accion="info" aria-label="Ver ficha"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg><small>FICHA</small></button>
    </div>
    <div class="mando-color" id="colores"></div>
  </aside>
</section>

<section class="ahora" id="ahora" aria-live="polite"></section>

<main id="filas" class="filas"></main>
<section id="resultados" class="resultados" hidden></section>

<dialog id="ficha" class="ficha" aria-labelledby="ficha-titulo"></dialog>

<div class="menu-perfil" id="menu-perfil" hidden role="menu">
  <button role="menuitem" data-perfil="adulto"><span class="perfil-ava">A</span> Adulto</button>
  <button role="menuitem" data-perfil="infantil"><span class="perfil-ava kids">I</span> Infantil</button>
</div>

<footer class="pie">
  <p>Contenido de demostración: películas abiertas de Blender Studio (licencia CC BY) y videos públicos de la NASA, reproducidos desde YouTube.</p>
  <p><a href="panel.html">Panel del dueño</a> · Mockup — Jamz Software · v1.1.1</p>
</footer>

<script type="module" src="assets/app.js"></script>
</body>
</html>
